<!DOCTYPE html>
<html>
<head>
    <title>Violators</title>
</head>
<body>
    <h2>Students Outside Hostel</h2>

    <table border="1">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Room</th>
            <th>Last Exit</th>
        </tr>

        {% for student in students %}
        <tr>
            <td>{{ student[0] }}</td>
            <td>{{ student[1] }}</td>
            <td>{{ student[2] }}</td>
            <td>{{ student[5] }}</td>
        </tr>
        {% endfor %}
    </table>

    <br>
    <a href="/">Go Home</a>
</body>
</html>
